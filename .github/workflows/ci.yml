name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations to an empty database
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration tests (real Postgres, fake object store)
        run: python -m pytest tests/integration -q
      - name: Golden-question evals (offline, real Postgres)
        run: python -m pytest tests/eval -q