services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    # Development only: run as root so the bind-mounted project stays writable, and reload on changes.
    # The image itself runs as an unprivileged user (see Dockerfile).
    user: root
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://ledger:ledger@db:5432/ledger
      - ENVIRONMENT=development
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata: