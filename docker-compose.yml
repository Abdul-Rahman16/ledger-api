services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    # Development only: run as root so the bind-mounted project stays writable, and reload on changes.
    # The image itself runs as an unprivileged user (see Dockerfile).
    user: root
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://ledger:ledger@db:5432/ledger
      - ENVIRONMENT=development
    env_file:
      - .env
    depends_on:
      - db

  # Local orchestration demo. Start it with:  docker compose --profile airflow up -d airflow
  # "standalone" runs every Airflow component in one container with a SQLite metadata DB:
  # fine for local use, not for production.
  airflow:
    image: apache/airflow:3.3.1
    profiles: ["airflow"]
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      LEDGER_API_URL: http://api:8000
      LEDGER_INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
    depends_on:
      - api

volumes:
  pgdata: